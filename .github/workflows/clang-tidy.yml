name: Clang-Tidy

# Visual Studio's integrated Clang-Tidy over every first-party translation unit:
# tools\validate-cpp.ps1 -Mode Analyze compiles each file with its own MSVC
# defines, include paths and precompiled header and analyzes it, and reports
# what it finds in the first-party headers those files include as well. The tree
# has no findings, so any first-party finding fails the job: it is new. The validation
# workflow calls this on pushes and pull requests, and the release workflow on
# the tag before it drafts a release, so the analysis no longer has to be run by
# hand.
#
# Each project is analyzed on a runner of its own (-Project) as a single share
# (-Shard 1/1): every first-party file, compiled without linking, the way
# Visual Studio analyzes selected files. A project can be split over more
# runners with -Shard k/n (every n-th file); each share fails unless it
# analyzed exactly the files it selected, so the shares cover every file
# between them. The harness runs in the validation and release builds, not
# here. With
# the VIRTUALQUEST_DEPLOY_KEY secret (passed on by the caller) the test shares
# include the simulated headset's scenarios, as locally, and their findings fail
# the job too; without it the public suite is analyzed. Third-party sources and
# headers are outside the check either way.
on:
  workflow_call:
    inputs:
      ref:
        description: The commit, branch or tag to analyze; the caller's own when empty
        type: string
        default: ''
    secrets:
      VIRTUALQUEST_DEPLOY_KEY:
        description: Read-only deploy key on VirtualQuest; without it the public suite is analyzed
        required: false
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: analyze (${{ matrix.project }} ${{ matrix.shard }})
    runs-on: windows-2022
    timeout-minutes: 60
    strategy:
      # Every share reports, so one share's findings do not hide another's.
      fail-fast: false
      matrix:
        # 7 driver, 31 overlay and 42 test files (39 without the simulated
        # headset's). The test project takes about eight minutes, far less
        # than the input-validation proofs that pushes and releases also wait
        # for, so more runners would not finish either sooner.
        include:
          - { project: Driver, shard: 1/1 }
          - { project: Overlay, shard: 1/1 }
          - { project: Tests, shard: 1/1 }
    env:
      HAS_VIRTUALQUEST: ${{ secrets.VIRTUALQUEST_DEPLOY_KEY != '' }}

    steps:
      - name: Check out the source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      # Only the test project compiles the simulated headset's scenarios.
      - name: Check out VirtualQuest
        if: env.HAS_VIRTUALQUEST == 'true' && matrix.project == 'Tests'
        timeout-minutes: 5
        shell: pwsh
        env:
          VIRTUALQUEST_DEPLOY_KEY: ${{ secrets.VIRTUALQUEST_DEPLOY_KEY }}
        run: tools\ci\checkout-virtualquest.ps1

      # Exit 3 is the script's "first-party findings" (listed above the error);
      # anything else non-zero is a failed compile, missing tools, or a share
      # Clang-Tidy did not analyze in full. On success it prints how many
      # translation units were analyzed.
      - name: Analyze share ${{ matrix.shard }} of ${{ matrix.project }}
        timeout-minutes: 50
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File tools\validate-cpp.ps1 -Mode Analyze -All -Project ${{ matrix.project }} -Shard ${{ matrix.shard }}
          $code = $LASTEXITCODE
          if ($code -eq 3) {
            Write-Host '::error::Clang-Tidy reported first-party findings, listed above. The tree had none, so each one is new.'
            exit 1
          }
          if ($code -ne 0) { throw "The compile, the analysis itself or the tools failed (exit $code)." }
