name: Release

# Pushing a questcalibrator-v* tag builds it on a clean Windows machine with the
# full test suite (VirtualQuest included) and the pose hub trace replay through
# its TLA+ model, packages it, scans it on VirusTotal,
# creates a DRAFT release in the public releases repository, and runs the
# install test on that draft. Nothing reaches users until the draft is
# published by hand.
#
# Secrets:
#   VIRTUALQUEST_DEPLOY_KEY  read-only deploy key on VirtualQuest. Required: a
#                            release is never tested on less than a local one.
#   PUBLIC_RELEASE_TOKEN     fine-grained token for the public repository only,
#                            with Contents: read and write.
#   VT_API_KEY               VirusTotal API key. Without it the scan is skipped
#                            and the release notes say so.
on:
  push:
    tags: ['questcalibrator-v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing questcalibrator-v* tag to release
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  PUBLIC_REPO: VividNightmareUnleashed/QuestCalibrator
  TAG: ${{ inputs.tag || github.ref_name }}
  TLA2TOOLS_URL: https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar
  TLA2TOOLS_SHA256: 936a262061c914694dfd669a543be24573c45d5aa0ff20a8b96b23d01e050e88

# Two jobs: build tests, packages and scans, and keeps the result with the run;
# publish does everything that writes to the public repository, from that kept
# package. A failed publish is repeated with "Re-run failed jobs" in a minute,
# without building again.
#
# A tag on a commit whose message contains [skip release] starts nothing
# (publish and the install test need build, so they skip too); cut that
# release locally with install\release.ps1 instead. A run started by hand
# always goes ahead.
jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, '[skip release]') }}
    runs-on: windows-2022
    timeout-minutes: 90
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      scenarios: ${{ steps.build.outputs.scenarios }}

    steps:
      - name: Check out the tagged source
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false

      - name: Refuse to replace an existing release
        timeout-minutes: 3
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.PUBLIC_RELEASE_TOKEN }}
          VQ_KEY_SET: ${{ secrets.VIRTUALQUEST_DEPLOY_KEY != '' }}
        run: |
          if (-not $env:GH_TOKEN) { throw 'The PUBLIC_RELEASE_TOKEN secret is not set.' }
          if ($env:VQ_KEY_SET -ne 'true') {
            throw 'The VIRTUALQUEST_DEPLOY_KEY secret is not set; a release needs the full test suite.'
          }
          # Only "release not found" means there is none; anything else (a bad
          # token, no access, a network error) must stop the run here rather
          # than after the build.
          $answer = gh release view $env:TAG --repo $env:PUBLIC_REPO --json tagName 2>&1
          if ($LASTEXITCODE -eq 0) {
            throw "$env:PUBLIC_REPO already has a release for $env:TAG. Never replace a release; tag a new version."
          }
          if ("$answer" -notmatch 'release not found') {
            throw "Could not check $env:PUBLIC_REPO for $env:TAG with PUBLIC_RELEASE_TOKEN: $answer"
          }
          $global:LASTEXITCODE = 0

      - name: Find the pinned VirtualQuest commit
        id: vq
        shell: pwsh
        run: '"sha=$(git rev-parse HEAD:VirtualQuest)" >> $env:GITHUB_OUTPUT'

      - name: Check out VirtualQuest
        timeout-minutes: 5
        shell: pwsh
        env:
          VIRTUALQUEST_DEPLOY_KEY: ${{ secrets.VIRTUALQUEST_DEPLOY_KEY }}
        run: tools\ci\checkout-virtualquest.ps1

      - name: Build and run the full test suite
        timeout-minutes: 30
        id: build
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File tools\validate-cpp.ps1 -Mode Build | Tee-Object -Variable log
          if ($LASTEXITCODE -ne 0) { throw 'The build or the solver tests failed.' }
          $count = ($log | Select-String -Pattern 'Solver tests passed: (\d+) scenario' | Select-Object -Last 1).Matches[0].Groups[1].Value
          "scenarios=$count" >> $env:GITHUB_OUTPUT

      - name: Replay the pose hub traces through the model
        timeout-minutes: 10
        shell: pwsh
        run: |
          $jar = Join-Path $env:RUNNER_TEMP 'tla2tools.jar'
          Invoke-WebRequest -Uri $env:TLA2TOOLS_URL -OutFile $jar
          $hash = (Get-FileHash $jar -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne $env:TLA2TOOLS_SHA256) { throw "tla2tools.jar has SHA-256 $hash, not the pinned one." }
          $env:TLA2TOOLS_JAR = $jar
          $env:JAVA_HOME = $env:JAVA_HOME_17_X64
          $env:Path = "$env:JAVA_HOME_17_X64\bin;$env:Path"
          pwsh -NoProfile -File VirtualQuest\formal\check.ps1 -Only Traces
          if ($LASTEXITCODE -ne 0) { throw 'A recorded hub run is not a behaviour of the model.' }

      - name: Duplicate scan (advisory)
        timeout-minutes: 5
        continue-on-error: true
        shell: pwsh
        run: |
          npm install --global --no-fund --no-audit jscpd@5.0.12 | Out-Null
          powershell -NoProfile -ExecutionPolicy Bypass -File tools\validate-cpp.ps1 -Mode Duplicates
          if ($LASTEXITCODE -ne 0) { Write-Host '::warning::The duplicate scan reported clones; review them before publishing.'; exit 1 }

      - name: Check the version matches the tag
        timeout-minutes: 2
        id: version
        shell: pwsh
        run: |
          $version = (Get-Item x64\Release\QuestCalibrator.exe).VersionInfo.ProductVersion
          if ("questcalibrator-v$version" -ne $env:TAG) {
            throw "The build reports version $version, but the tag is $env:TAG. Fix common/Version.h and tag again."
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "prerelease=$(if ($version.Contains('-')) { 'true' } else { 'false' })" >> $env:GITHUB_OUTPUT

      # Code signing of the exe and driver DLL goes here, once a certificate is
      # set up, so the package and its hashes cover the signed files.

      - name: Package
        timeout-minutes: 10
        id: package
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $info = Join-Path $env:RUNNER_TEMP 'BUILD-INFO.txt'
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property catalog_productDisplayVersion
          @(
            'QuestCalibrator release build'
            "version=$version"
            "tag=$env:TAG"
            "commit=$(git rev-parse HEAD)"
            "virtualquest=${{ steps.vq.outputs.sha }}"
            "scenarios=${{ steps.build.outputs.scenarios }}"
            "build_utc=$((Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ'))"
            "runner_image=$env:ImageOS $env:ImageVersion"
            "visual_studio=$vs"
            "package_script_sha256=$((Get-FileHash install\build-package.ps1 -Algorithm SHA256).Hash)"
            "workflow_run=$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
          ) | Set-Content -LiteralPath $info -Encoding utf8
          install\build-package.ps1 -BuildInfoPath $info
          $zip = Join-Path $PWD "install\out\QuestCalibrator-$version.zip"
          if (-not (Test-Path -LiteralPath $zip)) { throw "Expected package $zip was not produced." }
          "zip=$zip" >> $env:GITHUB_OUTPUT

      - name: Scan on VirusTotal
        timeout-minutes: 25
        shell: pwsh
        env:
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
        run: |
          if (-not $env:VT_API_KEY) {
            Write-Host '::warning::VT_API_KEY is not set; skipping the VirusTotal scan.'
            exit 0
          }
          install\virustotal-scan.ps1 -Package '${{ steps.package.outputs.zip }}'

      - name: Write the release notes
        timeout-minutes: 5
        shell: pwsh
        run: |
          $zip = '${{ steps.package.outputs.zip }}'
          $zipName = Split-Path -Leaf $zip
          $hash = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          git fetch --quiet --force origin "refs/tags/${env:TAG}:refs/tags/${env:TAG}"
          $message = (git tag -l --format='%(contents:body)' $env:TAG) -join "`n"
          $scan = [IO.Path]::ChangeExtension($zip, '.virustotal.md')
          $notes = @(
            '## Changes'
            ''
            $(if ($message.Trim()) { $message.Trim() } else { '_Write the changes before publishing._' })
            ''
            '## Download'
            ''
            "Download ``$zipName`` below, then follow ``README-INSTALL.txt`` inside it."
            ''
            "SHA-256 of ``$zipName``:"
            ''
            '```'
            $hash
            '```'
            ''
            ('Check it with `Get-FileHash .\' + $zipName + ' -Algorithm SHA256`. ' +
              '`SHA256SUMS.txt` in the package lists every file inside it.')
            ''
            '## VirusTotal'
            ''
            $(if (Test-Path -LiteralPath $scan) { Get-Content -LiteralPath $scan } else { '_Not scanned._' })
          )
          $notes | Set-Content -LiteralPath install\out\notes.md -Encoding utf8

      - name: Keep the package with this run
        timeout-minutes: 10
        uses: actions/upload-artifact@v4
        with:
          name: package-${{ env.TAG }}
          path: |
            install/out/*.zip
            install/out/*.sha256
            install/out/*.virustotal.md
            install/out/notes.md
          if-no-files-found: error
          retention-days: 90

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      tag: ${{ env.TAG }}

    steps:
      - name: Check out the tagged source
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false

      - name: Fetch the package
        uses: actions/download-artifact@v4
        with:
          name: package-${{ env.TAG }}
          path: package

      - name: Sync the public repository's files
        timeout-minutes: 5
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.PUBLIC_RELEASE_TOKEN }}
        run: |
          $public = Join-Path $env:RUNNER_TEMP 'public'
          # gh authenticates the clone and, as git's credential helper, the
          # push, so the token never goes into a URL or .git/config.
          gh auth setup-git
          gh repo clone $env:PUBLIC_REPO $public -- --quiet --depth 1
          if ($LASTEXITCODE -ne 0) { throw "Cloning $env:PUBLIC_REPO failed." }
          Copy-Item public/README.md, LICENSE, THIRD-PARTY-NOTICES.txt -Destination $public -Force
          git -C $public add README.md LICENSE THIRD-PARTY-NOTICES.txt
          git -C $public diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git -C $public -c user.name='github-actions[bot]' -c user.email='41898099+github-actions[bot]@users.noreply.github.com' `
              commit --quiet -m "docs: update for $env:TAG"
            git -C $public push --quiet origin HEAD
            if ($LASTEXITCODE -ne 0) { throw 'Pushing to the public repository failed.' }
          }
          $global:LASTEXITCODE = 0

      - name: Create the draft release
        timeout-minutes: 10
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.PUBLIC_RELEASE_TOKEN }}
        run: |
          $zip = (Get-Item package/*.zip).FullName
          # The build job refused an existing release, so a draft here is this
          # run's own, left by an attempt that failed partway: finish its
          # uploads instead of creating a second one.
          $draft = gh release view $env:TAG --repo $env:PUBLIC_REPO --json isDraft --jq .isDraft 2>$null
          if ($LASTEXITCODE -eq 0) {
            if ($draft -ne 'true') { throw "$env:TAG is already published in $env:PUBLIC_REPO." }
            gh release upload $env:TAG $zip "$zip.sha256" --repo $env:PUBLIC_REPO --clobber
            if ($LASTEXITCODE -ne 0) { throw 'Uploading to the existing draft failed.' }
            Write-Host "::notice::Finished the existing draft for $env:TAG."
            exit 0
          }
          $global:LASTEXITCODE = 0

          # GitHub dates and orders published releases by the commit their tag
          # points to. This repository changes only when its docs do, so
          # releases published without a change between them would share a
          # commit, tie, and sort in no particular order. Each release gets
          # its own empty commit, made now, on top of main and reachable only
          # from its tag. A tag left by an earlier attempt is kept.
          gh api "repos/$env:PUBLIC_REPO/git/ref/tags/$env:TAG" --silent 2>$null
          if ($LASTEXITCODE -ne 0) {
            $head = gh api "repos/$env:PUBLIC_REPO/commits/HEAD" | ConvertFrom-Json
            $commit = @{
              message = "release: QuestCalibrator ${{ needs.build.outputs.version }}"
              tree    = $head.commit.tree.sha
              parents = @($head.sha)
            } | ConvertTo-Json
            $sha = $commit | gh api "repos/$env:PUBLIC_REPO/git/commits" --input - --jq .sha
            if ($LASTEXITCODE -ne 0 -or -not $sha) { throw "Creating the release commit for $env:TAG failed." }
            gh api "repos/$env:PUBLIC_REPO/git/refs" -f ref="refs/tags/$env:TAG" -f sha=$sha --silent
            if ($LASTEXITCODE -ne 0) { throw "Creating the tag $env:TAG failed." }
          }
          $global:LASTEXITCODE = 0

          $arguments = @(
            'release', 'create', $env:TAG, $zip, "$zip.sha256",
            '--repo', $env:PUBLIC_REPO,
            '--verify-tag',
            '--draft',
            '--title', 'QuestCalibrator ${{ needs.build.outputs.version }}',
            '--notes-file', 'package/notes.md'
          )
          if ('${{ needs.build.outputs.prerelease }}' -eq 'true') { $arguments += '--prerelease' }
          gh @arguments
          if ($LASTEXITCODE -ne 0) { throw 'Creating the draft release failed.' }
          Write-Host "::notice::Draft release created for $env:TAG from ${{ needs.build.outputs.scenarios }} passing scenarios."

  install-test:
    needs: publish
    uses: ./.github/workflows/install-test.yml
    with:
      tag: ${{ needs.publish.outputs.tag }}
    secrets:
      PUBLIC_RELEASE_TOKEN: ${{ secrets.PUBLIC_RELEASE_TOKEN }}
