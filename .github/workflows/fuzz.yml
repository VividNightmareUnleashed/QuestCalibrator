name: Fuzz

# The coverage-guided fuzzers in Tests/Fuzz (libFuzzer and AddressSanitizer,
# tools/fuzz.ps1), once a week and on demand: each target on its own runner at
# the same time, for five minutes. Each target's corpus is kept between runs,
# so each run continues from the coverage the last one reached. The harness
# already replays the same properties over seeded mutations on every push and
# pull request; this is the longer search.
on:
  schedule:
    - cron: '0 3 * * 0'
  workflow_dispatch:
    inputs:
      seconds:
        description: Seconds per target
        required: false
        default: '300'

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: windows-2022
    timeout-minutes: 45
    strategy:
      # One target's failure leaves the others to finish their search.
      fail-fast: false
      matrix:
        # The same list as Targets() in Tests/Fuzz/FuzzTargets.h; the
        # validation build fails when they differ.
        target: [profile, settings, feed, lighthouse, request, frame-recovery]

    steps:
      - name: Check out the source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # A scheduled run starts from the default branch, which holds the
          # last stable release; fuzz alpha, where changes land first.
          ref: ${{ github.event_name == 'schedule' && 'alpha' || '' }}
          persist-credentials: false

      - name: Restore the corpus
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: x64/fuzz/${{ matrix.target }}/corpus
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ matrix.target }}-

      - name: Fuzz ${{ matrix.target }}
        shell: pwsh
        run: |
          $seconds = if ('${{ inputs.seconds }}') { [int]'${{ inputs.seconds }}' } else { 300 }
          powershell -NoProfile -ExecutionPolicy Bypass -File tools\fuzz.ps1 -Seconds $seconds -Targets ${{ matrix.target }}
          if ($LASTEXITCODE -ne 0) { throw 'The fuzz target failed; its input and log are attached to this run.' }

      - name: Keep the failing input
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fuzz-failures-${{ matrix.target }}
          path: |
            x64/fuzz/${{ matrix.target }}/crash-*
            x64/fuzz/${{ matrix.target }}/last-run.txt
          retention-days: 30
