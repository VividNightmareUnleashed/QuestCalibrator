name: Validation

# The release gates on pushes to alpha and stable and on pull requests into
# them: the Release build and the solver harness, every preview screen drawn
# in each language, and the installer's tests on the build's own package
# (blocking), then the duplicate scan (advisory, as locally: its findings need
# a human's review, not an automatic veto); in parallel jobs, the harness again
# in Debug and with AddressSanitizer (blocking), and Clang-Tidy over every
# translation unit (clang-tidy.yml; blocking, since the tree has no findings).
# Changes to documentation alone don't trigger it; the release workflow
# builds, tests and analyzes the tagged commit anyway.
#
# With the VIRTUALQUEST_DEPLOY_KEY secret (a read-only deploy key on the
# private VirtualQuest repository) the harness also builds the simulated
# headset's scenarios and the formal-model links, and the pose hub traces are
# replayed through their TLA+ model. Without it the run says so and tests the
# public suite only.
#
# Pull requests from forks never get the secret, and neither does a fork's own
# copy of this workflow. Those runs skip every job below that needs
# VirtualQuest (the job-level if: below names the case), so the checks list
# shows them as skipped rather than as passed with nothing checked. In this
# repository a missing secret is a mistake, and those jobs fail on it.
#
# The input-validation job needs the same key. On Linux, since windows-2022
# cannot run Linux containers, it runs VirtualQuest's bounded model checks of
# the driver's inbound validation, the ring sample gate and the profile scalar
# bounds (formal/check.ps1 -Only input-validation: ESBMC and Gappa in the
# questcal-esbmc image) against this tree's headers. Nothing else here catches
# a loosened bound in them, so the job fails on a skipped check as well as a
# wrong outcome. The release workflow runs the complete suite, the four
# simulator guard harnesses included, through formal-assurance.yml. This job
# runs on six runners at once (check.ps1 -Shard, which balances them by the
# time each check last took), about 16 minutes of checks each: it is the
# longest job a push waits for, so it gets the runners the shorter jobs do not
# need. The image is cached by its Dockerfile's hash. A pull request only reads
# caches saved on its own or its base branch, so the image a push to alpha
# saves lets pull requests into alpha skip the build.
#
# The Now and inventory-extension jobs check production contracts, intended
# mutation failures and acceptance fixtures on Linux. They use the exact
# VirtualQuest pin for their harnesses.
#
# The private-core job runs VirtualQuest's own formal suite, TLC, Lean and
# GenMC, on four runners (formal-assurance.yml). Its output stays off this
# public log; a failure names the checks that failed, to be run locally. Run
# by hand with evidence, it also assembles the release's Linux evidence for the
# commit, which needs its published V09 record: the release's formal gate,
# tried before the tag.
on:
  push:
    branches: [alpha, stable]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'math.pdf'
      - 'LICENSE'
      - 'THIRD-PARTY-NOTICES.txt'
  pull_request:
    branches: [alpha, stable]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'math.pdf'
      - 'LICENSE'
      - 'THIRD-PARTY-NOTICES.txt'
  workflow_dispatch:
    inputs:
      evidence:
        description: Also assemble the release's Linux formal evidence (needs the published V09 record)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: validation-${{ github.ref }}
  cancel-in-progress: true

env:
  TLA2TOOLS_URL: https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar
  TLA2TOOLS_SHA256: 936a262061c914694dfd669a543be24573c45d5aa0ff20a8b96b23d01e050e88
  # Mesa's software OpenGL (llvmpipe), which draws the preview screens on a
  # runner without a GPU. The digest is the one GitHub lists for the asset.
  MESA_URL: https://github.com/pal1000/mesa-dist-win/releases/download/26.2.3/mesa3d-26.2.3-release-msvc.7z
  MESA_SHA256: 3f3613adb43cfd0f2e665ce2400b130c275f0b3317cb3a05566320a3a67589ed
  # elan at a pinned release, checked against the digest GitHub lists for it;
  # its install script would fetch whatever release is newest.
  ELAN_URL: https://github.com/leanprover/elan/releases/download/v4.2.4/elan-x86_64-unknown-linux-gnu.tar.gz
  ELAN_SHA256: 42b94d4244e8353142c456ec0e4ca6528fd898a6c604d4059f494e706e431f63

jobs:
  validate:
    runs-on: windows-2022
    timeout-minutes: 75
    env:
      HAS_VIRTUALQUEST: ${{ secrets.VIRTUALQUEST_DEPLOY_KEY != '' }}

    steps:
      - name: Check out the source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Note a missing VirtualQuest key
        if: env.HAS_VIRTUALQUEST != 'true'
        shell: pwsh
        run: |
          Write-Host '::warning::VIRTUALQUEST_DEPLOY_KEY is not set: the simulated-headset scenarios, the formal-model links and the hub traces are not run.'

      # The key only opens VirtualQuest, so it is checked out on its own at the
      # commit this tree pins (tools/ci/checkout-virtualquest.ps1 says why not
      # with actions/checkout).
      - name: Check out VirtualQuest
        if: env.HAS_VIRTUALQUEST == 'true'
        timeout-minutes: 5
        shell: pwsh
        env:
          VIRTUALQUEST_DEPLOY_KEY: ${{ secrets.VIRTUALQUEST_DEPLOY_KEY }}
        run: tools\ci\checkout-virtualquest.ps1

      # The formal suite's pins on this source, in seconds: a refactor that
      # moved pinned code fails here, naming the pin and where it went, instead
      # of in the formal jobs much later.
      - name: Check the formal suite's pins on this source
        if: env.HAS_VIRTUALQUEST == 'true'
        timeout-minutes: 5
        shell: pwsh
        run: |
          python VirtualQuest/formal/check-pins.py
          if ($LASTEXITCODE -ne 0) { throw 'A pin of the formal suite no longer holds; it is named above.' }

      # Every step has its own limit, a few times its usual length, so a hung
      # step fails in minutes instead of holding the runner to the job limit.
      - name: Build and run the solver harness
        id: build
        timeout-minutes: 30
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File tools\validate-cpp.ps1 -Mode Build
          if ($LASTEXITCODE -ne 0) { throw 'The build or the solver harness failed.' }

      - name: Replay the pose hub traces through the model
        if: env.HAS_VIRTUALQUEST == 'true'
        timeout-minutes: 10
        shell: pwsh
        run: |
          $jar = Join-Path $env:RUNNER_TEMP 'tla2tools.jar'
          Invoke-WebRequest -Uri $env:TLA2TOOLS_URL -OutFile $jar
          $hash = (Get-FileHash $jar -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne $env:TLA2TOOLS_SHA256) { throw "tla2tools.jar has SHA-256 $hash, not the pinned one." }
          $env:TLA2TOOLS_JAR = $jar
          $env:JAVA_HOME = $env:JAVA_HOME_17_X64
          $env:Path = "$env:JAVA_HOME_17_X64\bin;$env:Path"
          pwsh -NoProfile -File VirtualQuest\formal\check.ps1 -Only Traces -Strict
          if ($LASTEXITCODE -ne 0) { throw 'A recorded hub run is not a behaviour of the model.' }

      # Every preview screen in each language (tools\check-screens.ps1), drawn
      # by the build's executable through Mesa's software OpenGL: a screen that
      # crashes, hangs or draws nothing fails here, however rarely players
      # reach it. Runs whenever the build passed, and keeps the pictures.
      - name: Draw every screen
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 15
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'mesa.7z'
          Invoke-WebRequest -Uri $env:MESA_URL -OutFile $archive
          $hash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne $env:MESA_SHA256) { throw "The Mesa archive has SHA-256 $hash, not the pinned one." }
          $mesa = Join-Path $env:RUNNER_TEMP 'mesa'
          & "$env:ProgramFiles\7-Zip\7z.exe" e $archive "-o$mesa" x64\opengl32.dll x64\libgallium_wgl.dll -y | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'Unpacking Mesa failed.' }
          powershell -NoProfile -ExecutionPolicy Bypass -File tools\check-screens.ps1 -OpenGL $mesa -Out "$env:RUNNER_TEMP\screens"
          if ($LASTEXITCODE -ne 0) { throw 'A preview screen failed; the run is named above.' }

      - name: Keep the screens with this run
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: screens
          path: ${{ runner.temp }}/screens
          if-no-files-found: warn
          retention-days: 14

      # The installer on every push, not first after tagging: its helper tests
      # in Windows PowerShell, the engine the installer and the updater run
      # in, then this build's own package installed, upgraded from the newest
      # published release and uninstalled against the fake OpenVR runtime, as
      # the release workflow tests each draft. The runner is thrown away
      # afterwards, so the install test may write to Program Files and HKLM.
      - name: Test the installer
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 20
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          foreach ($test in 'test-filesystem-policy', 'test-update-helper', 'test-conflict-removal') {
            powershell -NoProfile -ExecutionPolicy Bypass -File "install\$test.ps1"
            if ($LASTEXITCODE -ne 0) { throw "install\$test.ps1 failed." }
          }
          install\build-package.ps1 -OutDir "$env:RUNNER_TEMP\package"
          if ($LASTEXITCODE -ne 0) { throw 'Packaging the build failed.' }
          tools\fake-openvr-runtime\build.ps1 -Out "$env:RUNNER_TEMP\fake-steamvr"
          $arguments = @{ Package = (Get-Item "$env:RUNNER_TEMP\package\*.zip").FullName; Runtime = "$env:RUNNER_TEMP\fake-steamvr" }
          $previous = gh release list --repo $env:GITHUB_REPOSITORY --exclude-drafts --limit 1 --json tagName --jq '.[].tagName'
          if ($previous) {
            Write-Host "Upgrade scenario from $previous"
            gh release download $previous --repo $env:GITHUB_REPOSITORY --pattern '*.zip' --dir "$env:RUNNER_TEMP\previous"
            if ($LASTEXITCODE -ne 0) { throw "Downloading $previous failed." }
            $arguments.Previous = (Get-Item "$env:RUNNER_TEMP\previous\*.zip").FullName
          }
          tools\fake-openvr-runtime\test-install.ps1 @arguments
          if ($LASTEXITCODE -ne 0) { throw 'The install test failed; the failing checks are listed above.' }

      - name: Duplicate scan (advisory)
        timeout-minutes: 5
        continue-on-error: true
        shell: pwsh
        run: |
          npm install --global --no-fund --no-audit jscpd@5.0.12 | Out-Null
          powershell -NoProfile -ExecutionPolicy Bypass -File tools\validate-cpp.ps1 -Mode Duplicates
          if ($LASTEXITCODE -ne 0) { Write-Host '::warning::The duplicate scan reported clones; review them.'; exit 1 }

  # The harness in Debug, with the debug runtime's checks and asserts on, and
  # in Release with AddressSanitizer, which turns a stray read or write in the
  # pose ring or the pipe code into a report naming the line instead of a
  # crash inside vrserver. On a runner of its own, beside the build job.
  harness-checks:
    name: harness (Debug, AddressSanitizer)
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      HAS_VIRTUALQUEST: ${{ secrets.VIRTUALQUEST_DEPLOY_KEY != '' }}

    steps:
      - name: Check out the source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Check out VirtualQuest
        if: env.HAS_VIRTUALQUEST == 'true'
        timeout-minutes: 5
        shell: pwsh
        env:
          VIRTUALQUEST_DEPLOY_KEY: ${{ secrets.VIRTUALQUEST_DEPLOY_KEY }}
        run: tools\ci\checkout-virtualquest.ps1

      - name: Build and run the harness in Debug
        id: debug
        timeout-minutes: 30
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File tools\validate-cpp.ps1 -Mode Build -Configuration Debug
          if ($LASTEXITCODE -ne 0) { throw 'The Debug build or its harness failed.' }

      # Runs whether or not the Debug run passed, so each reports.
      - name: Build and run the harness with AddressSanitizer
        if: ${{ !cancelled() && steps.debug.outcome != 'skipped' }}
        timeout-minutes: 20
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File tools\validate-cpp.ps1 -Mode Build -AddressSanitizer
          if ($LASTEXITCODE -ne 0) { throw 'The AddressSanitizer build or its harness failed; a report above names the line.' }

  # A full rebuild under analysis, so it runs beside the build job rather than
  # after it.
  clang-tidy:
    uses: ./.github/workflows/clang-tidy.yml
    secrets:
      VIRTUALQUEST_DEPLOY_KEY: ${{ secrets.VIRTUALQUEST_DEPLOY_KEY }}

  input-validation:
    name: input-validation (${{ matrix.shard }}/6)
    if: github.repository == 'VividNightmareUnleashed/QuestCalibrator' && github.event.pull_request.head.repo.fork != true
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      # Every share reports, so one failure does not hide another.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]

    steps:
      - name: Check out the source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # The runner image ships PowerShell; this covers an image that stops doing so.
      - name: Install PowerShell if missing
        timeout-minutes: 5
        run: |
          if command -v pwsh > /dev/null; then pwsh --version; exit 0; fi
          . /etc/os-release
          curl -fsSL -o "$RUNNER_TEMP/packages-microsoft-prod.deb" \
            "https://packages.microsoft.com/config/ubuntu/$VERSION_ID/packages-microsoft-prod.deb"
          sudo dpkg -i "$RUNNER_TEMP/packages-microsoft-prod.deb"
          sudo apt-get update
          sudo apt-get install -y powershell

      - name: Check out VirtualQuest
        timeout-minutes: 5
        shell: pwsh
        env:
          VIRTUALQUEST_DEPLOY_KEY: ${{ secrets.VIRTUALQUEST_DEPLOY_KEY }}
        run: tools/ci/checkout-virtualquest.ps1

      # Built here rather than by check.ps1, which hides a failed build as a
      # skipped check, and saved as soon as it is built, so a failing check
      # still leaves the image for the next run.
      - name: Restore the ESBMC image
        id: esbmc-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/questcal-esbmc.tar
          key: questcal-esbmc-${{ hashFiles('VirtualQuest/formal/input-validation/Dockerfile') }}

      - name: Load or build the ESBMC image
        timeout-minutes: 20
        run: |
          if [ '${{ steps.esbmc-cache.outputs.cache-hit }}' = 'true' ]; then
            docker load -i "$RUNNER_TEMP/questcal-esbmc.tar"
          else
            docker build -t questcal-esbmc VirtualQuest/formal/input-validation
            docker save -o "$RUNNER_TEMP/questcal-esbmc.tar" questcal-esbmc
          fi

      - name: Save the ESBMC image
        if: steps.esbmc-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/questcal-esbmc.tar
          key: questcal-esbmc-${{ hashFiles('VirtualQuest/formal/input-validation/Dockerfile') }}

      # The expanded 64-frame checks need one memory-heavy process per runner.
      # -Strict fails when Docker or the image is missing; the
      # SKIP test also catches sources check.ps1 cannot find, and a share that
      # ran nothing fails too.
      - name: Check the input validation (ESBMC and Gappa)
        timeout-minutes: 45
        shell: pwsh
        run: |
          pwsh -NoProfile -File VirtualQuest/formal/check.ps1 -Only input-validation -PublicInputValidation -Strict -Shard ${{ matrix.shard }}/6 | Tee-Object -Variable lines
          if ($LASTEXITCODE -ne 0) { throw 'An input-validation check did not come out as expected.' }
          if ($lines | Where-Object { "$_" -match '^SKIP ' }) { throw 'An input-validation check was skipped.' }
          if (-not ($lines | Where-Object { "$_" -match '^ok ' })) { throw 'This share ran no input-validation check.' }

  private-core:
    if: github.repository == 'VividNightmareUnleashed/QuestCalibrator' && github.event.pull_request.head.repo.fork != true
    uses: ./.github/workflows/formal-assurance.yml
    with:
      evidence: ${{ inputs.evidence == true }}
    secrets:
      VIRTUALQUEST_DEPLOY_KEY: ${{ secrets.VIRTUALQUEST_DEPLOY_KEY }}

  now-contracts:
    if: github.repository == 'VividNightmareUnleashed/QuestCalibrator' && github.event.pull_request.head.repo.fork != true
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      ELAN_TOOLCHAIN: leanprover/lean4:v4.34.0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Check out VirtualQuest
        shell: pwsh
        env:
          VIRTUALQUEST_DEPLOY_KEY: ${{ secrets.VIRTUALQUEST_DEPLOY_KEY }}
        run: tools/ci/checkout-virtualquest.ps1
      # The private core caches Lean under the same key, so a download by
      # either job serves both until the toolchain changes.
      - name: Restore Lean
        id: lean-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.elan
          key: elan-${{ runner.os }}-v4.2.4-${{ env.ELAN_TOOLCHAIN }}
      - name: Install the pinned Lean toolchain
        if: steps.lean-cache.outputs.cache-hit != 'true'
        run: |
          curl -fsSL "$ELAN_URL" -o "$RUNNER_TEMP/elan.tar.gz"
          echo "$ELAN_SHA256  $RUNNER_TEMP/elan.tar.gz" | sha256sum -c - > /dev/null
          tar -xzf "$RUNNER_TEMP/elan.tar.gz" -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/elan-init" -y --no-modify-path --default-toolchain "$ELAN_TOOLCHAIN"
      - name: Put Lean on the path
        run: echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Check all Now contracts and negative cases
        run: python tools/verify-now-contracts.py --source-root "$PWD" --output-dir "$RUNNER_TEMP/now"
      - name: Check local evidence acceptance and metadata redaction
        run: python tools/test-local-assurance.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: now-contracts
          path: ${{ runner.temp }}/now/result.json
          if-no-files-found: error
          retention-days: 90

  inventory-extension:
    if: github.repository == 'VividNightmareUnleashed/QuestCalibrator' && github.event.pull_request.head.repo.fork != true
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Check out VirtualQuest
        timeout-minutes: 5
        shell: pwsh
        env:
          VIRTUALQUEST_DEPLOY_KEY: ${{ secrets.VIRTUALQUEST_DEPLOY_KEY }}
        run: tools/ci/checkout-virtualquest.ps1
      - name: Check the worthwhile public inventory extension
        timeout-minutes: 20
        run: python tools/verify-inventory-extension.py --public-only --source-root "$PWD" --output-dir "$RUNNER_TEMP/extension"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: inventory-extension
          path: ${{ runner.temp }}/extension/result.json
          if-no-files-found: error
          retention-days: 90
