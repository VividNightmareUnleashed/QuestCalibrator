name: Formal assurance
on:
  workflow_call:
    inputs:
      ref:
        type: string
        required: true
permissions:
  contents: read
jobs:
  local-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Read local evidence for the exact source pair
        shell: pwsh
        env:
          VIRTUALQUEST_DEPLOY_KEY: ${{ secrets.VIRTUALQUEST_DEPLOY_KEY }}
        run: tools/ci/checkout-virtualquest.ps1 -LocalAssurancePath "$env:RUNNER_TEMP/local-assurance.json"
      - name: Verify local proof outcomes and source provenance
        run: python tools/local-assurance.py --source-root "$PWD" --evidence "$RUNNER_TEMP/local-assurance.json" --output "$RUNNER_TEMP/assurance-linux.json"
      - uses: actions/upload-artifact@v4
        with:
          name: assurance-linux
          path: ${{ runner.temp }}/assurance-linux.json
          if-no-files-found: error
          retention-days: 90
